<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gomoku — OBG</title>
<style>
/* Standalone Gomoku game — runs inside OBG platform iframe */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f1eb;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px; min-height: 100vh; gap: 10px;
}
h1 { font-size: 1.2rem; font-weight: 800; color: #1a1a1a; }

#status-bar {
  padding: 9px 22px; background: #fff; border-radius: 99px;
  box-shadow: 0 2px 10px rgba(0,0,0,.1); font-size: .88rem; font-weight: 600;
  text-align: center; min-width: 260px; transition: color .3s;
}

#players-bar {
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
}
.player-ind {
  display: flex; align-items: center; gap: 8px;
  background: #fff; padding: 7px 16px; border-radius: 99px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08); font-weight: 600; font-size: .85rem;
  transition: outline .15s;
}
.player-ind.active-turn { outline: 3px solid #5aaa38; }
.stone-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
.stone-dot.black { background: radial-gradient(circle at 35% 35%, #888, #111); }
.stone-dot.white { background: radial-gradient(circle at 35% 35%, #fff, #ccc); border: 2px solid #999; }

/* Board */
.board-wrap {
  background: #dcb868; border-radius: 10px; padding: 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); display: inline-block;
}
#board { display: grid; grid-template-columns: repeat(15, 34px); cursor: pointer; user-select: none; }

/* Each cell represents a grid intersection */
.cell {
  width: 34px; height: 34px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
/* Grid lines via pseudo-elements */
.cell::before { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #8b6914; z-index: 0; transform: translateX(-50%); }
.cell::after  { content: ''; position: absolute; top: 50%; left: 0; height: 2px; width: 100%; background: #8b6914; z-index: 0; transform: translateY(-50%); }
/* Clip lines at board edges */
.cell.r0::before  { top: 50%;  height: 50%; }
.cell.r14::before { top: 0;    height: 50%; }
.cell.c0::after   { left: 50%; width: 50%; }
.cell.c14::after  { left: 0;   width: 50%; }

/* Stone — absolutely positioned to always center on the intersection */
.stone {
  position: absolute;
  width: 28px; height: 28px; border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}
.stone.black { background: radial-gradient(circle at 35% 35%, #999, #111); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.stone.white { background: radial-gradient(circle at 35% 35%, #fff, #ddd); box-shadow: 0 2px 6px rgba(0,0,0,.3); border: 1.5px solid #aaa; }
.stone.last  { box-shadow: 0 0 0 3px #e74c3c, 0 2px 6px rgba(0,0,0,.4); }

/* Star point (hoshi) */
.star-dot {
  position: absolute;
  width: 6px; height: 6px; border-radius: 50%;
  background: #5a3e0a;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
}

/* Buttons */
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 8px 20px; border-radius: 99px; border: none; font-size: .85rem; font-weight: 600; cursor: pointer; }
.btn:hover { opacity: .85; }
.btn-resign { background: #d63031; color: #fff; }

/* Game-over overlay */
#overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
  align-items: center; justify-content: center; z-index: 100;
}
#overlay.show { display: flex; }
.overlay-card {
  background: #fff; border-radius: 16px; padding: 32px 40px; text-align: center;
  box-shadow: 0 12px 48px rgba(0,0,0,.3); max-width: 340px; width: 90%;
}
.overlay-card .ov-icon { font-size: 2.8rem; margin-bottom: 6px; }
.overlay-card h2 { font-size: 1.6rem; margin-bottom: 6px; }
.overlay-card p  { color: #666; margin-bottom: 20px; font-size: .9rem; }
</style>
</head>
<body>
<h1>Gomoku (Five in a Row)</h1>
<div id="status-bar">Waiting for platform...</div>

<div id="players-bar">
  <div class="player-ind" id="p1-ind"><div class="stone-dot black"></div><span id="p1-name">Black</span></div>
  <span style="align-self:center;color:#888;font-weight:700;font-size:.9rem">vs</span>
  <div class="player-ind" id="p2-ind"><div class="stone-dot white"></div><span id="p2-name">White</span></div>
</div>

<div class="board-wrap"><div id="board"></div></div>

<div class="actions">
  <button class="btn btn-resign" id="resign-btn" style="display:none" onclick="doResign()">Resign</button>
</div>

<div id="overlay">
  <div class="overlay-card">
    <div class="ov-icon" id="ov-icon"></div>
    <h2 id="ov-title"></h2>
    <p  id="ov-sub"></p>
    <button class="btn" style="background:#5aaa38;color:#fff"
      onclick="document.getElementById('overlay').classList.remove('show')">Close</button>
  </div>
</div>

<script>
/* =============================================================
   OBG Game SDK — Gomoku
   Integrates with the OBG platform via the standard SDK contract:
     Step 1: Listen for window postMessage type "OBG_INIT"
     Step 2: Connect to the relay WebSocket using wsUrl from OBG_INIT
     Step 3: Handle relay messages (ROOM_READY, MOVE, RESIGN, PLAYER_LEFT)
     Step 4: Send moves and resign via WebSocket
     Step 5: On game end notify backend (WS) and platform UI (postMessage)
   ============================================================= */

// ── SDK state ────────────────────────────────────────────────
let ws          = null;
let myUid       = null;
let allPlayers  = [];
let startTimeMs = null;

// ── Gomoku game state ────────────────────────────────────────
const SIZE       = 15;
let board        = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
let myColor      = 0;           // 1 = black, 2 = white
let currentPlayer = 1;          // whose turn (1 or 2)
let gameStatus   = 'WAITING';   // WAITING | PLAYING | ENDED
let playerColors = {};          // { uid -> color }
let heartbeatTimer = null;

// ── Step 1: Wait for OBG_INIT from the platform ──────────────
window.addEventListener('message', function initHandler(event) {
  const msg = event.data;

  // Platform forwarded OBG_RESIGN (from the Resign button on the platform UI)
  if (msg && msg.type === 'OBG_RESIGN') {
    if (gameStatus !== 'PLAYING') return;
    if (!confirm('Resign this game?')) return;
    sendResign();
    return;
  }

  if (!msg || msg.type !== 'OBG_INIT') return;
  window.removeEventListener('message', initHandler);

  myUid      = msg.myUid;
  allPlayers = msg.players || [];
  setStatus('Connecting...');

  // Step 2: Open WebSocket relay connection
  ws = new WebSocket(msg.wsUrl);
  ws.onopen    = () => setStatus('Waiting for opponent...');
  ws.onmessage = e  => handleMsg(JSON.parse(e.data));
  ws.onerror   = () => setStatus('Connection error', '#d63031');
  ws.onclose   = () => {
    if (gameStatus === 'PLAYING') {
      // Unexpected disconnect — notify platform so it can show a modal
      gameStatus = 'ENDED';
      stopHeartbeat();
      window.parent.postMessage({ type: 'OBG_GAME_OVER', winner: null, disconnected: true }, '*');
    }
  };

  // Heartbeat: keep the relay connection alive (PING every 20s)
  startHeartbeat();

  // Re-attach listener for OBG_RESIGN after init
  window.addEventListener('message', function resignHandler(ev) {
    if (!ev.data || ev.data.type !== 'OBG_RESIGN') return;
    if (gameStatus !== 'PLAYING') return;
    if (!confirm('Resign this game?')) return;
    sendResign();
  });
});

// ── Step 3: Handle messages from relay and platform ──────────
function handleMsg(msg) {
  switch (msg.type) {

    case 'PONG':
      // Heartbeat reply — connection is alive, no action needed
      break;

    case 'ROOM_READY': {
      startTimeMs = msg.startTimeMs || Date.now();
      (msg.players || []).forEach((p, i) => { playerColors[p.uid] = i + 1; });
      myColor = playerColors[myUid] || 1;
      gameStatus = 'PLAYING';
      currentPlayer = 1;


      (msg.players || []).forEach(p => {
        const color = playerColors[p.uid];
        // relay 的 name 字段 = fullName || username
        const label = p.name + (p.uid === myUid ? ' (You)' : '');
        if (color === 1) document.getElementById('p1-name').textContent = label;
        if (color === 2) document.getElementById('p2-name').textContent = label;
      });

      document.getElementById('resign-btn').style.display = '';
      updateTurnUI();
      window.parent.postMessage({ type: 'OBG_ROOM_READY', players: msg.players }, '*');
      break;
    }


    case 'MOVE': {
      const { row, col, color, fromUid } = msg;
      if (board[row][col] !== 0)    break; // duplicate — ignore
      if (color !== currentPlayer)  break; // out-of-order — ignore

      board[row][col] = color;
      renderStone(row, col, color, true);
      currentPlayer = color === 1 ? 2 : 1;

      if (checkWin(row, col, color)) {
        endGame(fromUid);
      } else if (boardFull()) {
        endGame(null);
      } else {
        updateTurnUI();
      }
      break;
    }

    case 'RESIGN': {
      // msg.fromUid is the player who resigned
      const resignerUid = msg.fromUid;
      const winnerUid   = Object.keys(playerColors).find(uid => uid !== resignerUid) || null;
      const iWon        = myUid === winnerUid;

      gameStatus = 'ENDED';
      stopHeartbeat();
      document.getElementById('resign-btn').style.display = 'none';
      showOverlay(
        iWon ? 'You Win!' : 'You Lost',
        iWon ? 'Your opponent resigned.' : 'You resigned.'
      );
      // Only the winner sends the game-over notification (avoid double recording)
      if (iWon) {
        notifyGameOver(winnerUid);
      } else {
        window.parent.postMessage({ type: 'OBG_GAME_OVER', winner: winnerUid }, '*');
      }
      break;
    }

    case 'PLAYER_LEFT': {
      if (gameStatus === 'PLAYING') {
        gameStatus = 'ENDED';
        stopHeartbeat();
        document.getElementById('resign-btn').style.display = 'none';
        showOverlay('You Win!', 'Opponent disconnected.');
        notifyGameOver(myUid);
      }
      break;
    }

    case 'OBG_GAME_OVER':
      // Backend acknowledged the game end — no UI action needed here
      break;
  }
}

// ── Step 4: Player actions ────────────────────────────────────
function cellClick(row, col) {
  if (gameStatus !== 'PLAYING')   return;
  if (currentPlayer !== myColor)  { setStatus('Not your turn.'); setTimeout(updateTurnUI, 800); return; }
  if (board[row][col] !== 0)      return;
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'MOVE', row, col, color: myColor }));
}

function doResign() {
  if (!confirm('Resign this game?')) return;
  sendResign();
}

function sendResign() {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'RESIGN' }));
  // The RESIGN message will be broadcast back to us, handled in handleMsg('RESIGN')
}

// ── Step 5: Notify game end ───────────────────────────────────
function endGame(winnerUid) {
  gameStatus = 'ENDED';
  stopHeartbeat();
  document.getElementById('resign-btn').style.display = 'none';

  if (winnerUid === null) {
    showOverlay('Draw!', 'The board is full. No winner.');
  } else {
    const iWon = winnerUid === myUid;
    showOverlay(iWon ? 'You Win!' : 'You Lost', iWon ? 'Congratulations!' : 'Better luck next time.');
  }

  notifyGameOver(winnerUid);
}

function notifyGameOver(winnerUid) {
  // Tell backend (records PlayHistory)
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'OBG_GAME_OVER', winner: winnerUid, startTimeMs: startTimeMs || 0 }));
  }
  // Tell platform UI (shows game-over modal)
  window.parent.postMessage({ type: 'OBG_GAME_OVER', winner: winnerUid }, '*');
}

// ── Heartbeat ─────────────────────────────────────────────────
function startHeartbeat() {
  stopHeartbeat();
  heartbeatTimer = setInterval(() => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'PING' }));
  }, 20000);
}
function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

// ── Board rendering ───────────────────────────────────────────
function buildBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement('div');
      const cls  = ['cell'];
      if (r === 0)        cls.push('r0');
      if (r === SIZE - 1) cls.push('r14');
      if (c === 0)        cls.push('c0');
      if (c === SIZE - 1) cls.push('c14');
      cell.className = cls.join(' ');
      // Star points at tengen and hoshi positions
      if ([3, 7, 11].includes(r) && [3, 7, 11].includes(c)) {
        const dot = document.createElement('div');
        dot.className = 'star-dot';
        cell.appendChild(dot);
      }
      const rr = r, cc = c;
      cell.addEventListener('click', () => cellClick(rr, cc));
      el.appendChild(cell);
    }
  }
}

function resetBoard() {
  board        = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  currentPlayer = 1;
  gameStatus    = 'WAITING';
  playerColors  = {};
  myColor       = 0;
  buildBoard(); // rebuild removes all stones
  document.getElementById('resign-btn').style.display = 'none';
  document.getElementById('p1-ind').classList.remove('active-turn');
  document.getElementById('p2-ind').classList.remove('active-turn');
  document.getElementById('p1-name').textContent = 'Black';
  document.getElementById('p2-name').textContent = 'White';
  setStatus('Waiting for opponent...');
}

function renderStone(row, col, color, isLast) {
  const cell = document.getElementById('board').children[row * SIZE + col];
  // Clear last-move highlight from previous stone
  document.querySelectorAll('.stone.last').forEach(s => s.classList.remove('last'));
  // Remove any existing stone on this cell
  cell.querySelectorAll('.stone').forEach(s => s.remove());
  if (color) {
    const s = document.createElement('div');
    s.className = `stone ${color === 1 ? 'black' : 'white'}${isLast ? ' last' : ''}`;
    cell.appendChild(s);
    // Hide star-dot when a stone occupies this cell (visual clarity)
    const starDot = cell.querySelector('.star-dot');
    if (starDot) starDot.style.visibility = 'hidden';
  } else {
    // Restore star-dot when stone is removed
    const starDot = cell.querySelector('.star-dot');
    if (starDot) starDot.style.visibility = '';
  }
}

// ── UI helpers ────────────────────────────────────────────────
function setStatus(text, color) {
  const el = document.getElementById('status-bar');
  el.textContent = text;
  el.style.color = color || '#333';
}

function updateTurnUI() {
  const myTurn = currentPlayer === myColor;
  setStatus(myTurn ? 'Your turn' : "Opponent's turn", myTurn ? '#5aaa38' : '#888');
  document.getElementById('p1-ind').classList.toggle('active-turn', currentPlayer === 1);
  document.getElementById('p2-ind').classList.toggle('active-turn', currentPlayer === 2);
}

function showOverlay(title, sub, icon) {
  const defaultIcons = { 'You Win!': '🏆', 'You Lost': '😔', 'Draw!': '🤝' };
  document.getElementById('ov-icon').textContent  = icon || defaultIcons[title] || '🎮';
  document.getElementById('ov-title').textContent = title;
  document.getElementById('ov-sub').textContent   = sub;
  document.getElementById('overlay').classList.add('show');
}

// ── Win detection ─────────────────────────────────────────────
function checkWin(row, col, color) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  return dirs.some(([dr, dc]) => {
    let n = 1;
    let r = row + dr, c = col + dc;
    while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === color) { n++; r += dr; c += dc; }
    r = row - dr; c = col - dc;
    while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === color) { n++; r -= dr; c -= dc; }
    return n >= 5;
  });
}

function boardFull() { return board.every(row => row.every(c => c !== 0)); }

// ----------------Initialise----------------------
buildBoard();
// Signal to the parent platform that this game page has finished loading and is ready
window.parent.postMessage({ type: 'OBG_READY' }, '*');
</script>
</body>
</html>
